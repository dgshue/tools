# Orange Pi RV2 (SpacemiT K1, riscv64)
# EFI/GPT boot via vendor U-Boot in SPI NOR; no in-image U-Boot needed.

export PRODUCT_KERNEL=RV2
export PRODUCT_TARGET=riscv
export PRODUCT_ARCH=riscv64
export PRODUCT_WANTS_CROSS="qemu-user-static"

# generic device handling, no device suffix (single riscv64 image variant)
unset PRODUCT_DEVICE

# EFI/GPT board: no raw U-Boot to dd into the image
arm_install_uboot()
{
	: # RV2 boots vendor U-Boot from SPI NOR + EFI loader; nothing to embed
}
